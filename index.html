<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Task Manager</h1>
        <p class="subtitle">Manage your daily tasks easily</p>

        <div class="task-input">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Enter your task"
            >

            <button onclick="addTask()">Add Task</button>
        </div>

        <div class="task-info">
            <span>Total Tasks: <b id="totalTasks">0</b></span>
            <span>Completed: <b id="completedTasks">0</b></span>
        </div>

        <div id="taskList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
